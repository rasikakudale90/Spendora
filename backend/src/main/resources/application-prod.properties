# Production Profile (Supabase Postgres & Render Deployment)

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection Pooling Settings (HikariCP for PgBouncer compatibility)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# Use update so Hibernate creates/updates tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway disabled - schema managed via SQL Editor in Supabase
spring.flyway.enabled=false

# CORS
spendora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Server port
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
