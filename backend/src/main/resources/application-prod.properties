# Production Profile (Supabase Postgres & Render Deployment)

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection Pooling Settings (HikariCP for PgBouncer compatibility)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# In prod, Flyway is disabled by default so DDL migrations are explicitly run via direct connection
spring.flyway.enabled=false
