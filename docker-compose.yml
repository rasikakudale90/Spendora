version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: spendora-postgres
    restart: always
    environment:
      POSTGRES_DB: spendoradb
      POSTGRES_USER: spendora_user
      POSTGRES_PASSWORD: spendora_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendora_user -d spendoradb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spendora-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/spendoradb
      DB_USERNAME: spendora_user
      DB_PASSWORD: spendora_password
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
